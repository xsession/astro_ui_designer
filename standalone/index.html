<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Astro UI Designer Pro</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="app bottom-minimized" id="app">
  <div class="menubar">
    <button data-menu="file">File</button><button data-menu="edit">Edit</button><button data-menu="form">Form</button><button data-menu="layout">Layout</button><button data-menu="view">View</button><button data-menu="project">Project</button><button data-menu="build">Build</button><button data-menu="help">Help</button>
    <span class="menu-spacer"></span><span class="product-title">Astro UI Designer Pro · 2.19 Dense Clean UI</span>
  </div>
  <div class="toolbar" aria-label="Designer command bar">
    <div class="tool-group file-tools toolbar-core"><button id="new-btn">New</button><button id="open-btn">Open</button><button id="save-btn">Save</button></div>
    <div class="tool-group history-tools toolbar-icon-group"><button id="undo-btn" aria-label="Undo">↶</button><button id="redo-btn" aria-label="Redo">↷</button></div>

    <details class="toolbar-menu" data-toolbar-menu="edit">
      <summary title="Editing commands">Edit <span aria-hidden="true">⌄</span></summary>
      <div class="toolbar-menu-panel">
        <div class="toolbar-menu-label">Clipboard</div>
        <button id="cut-btn">Cut</button><button id="copy-btn">Copy</button><button id="paste-btn">Paste</button>
        <div class="toolbar-menu-label">Object</div>
        <button id="duplicate-btn">Duplicate</button><button id="delete-btn" class="danger-action">Delete</button>
      </div>
    </details>

    <details class="toolbar-menu" data-toolbar-menu="arrange">
      <summary title="Layout and arrangement commands">Arrange <span aria-hidden="true">⌄</span></summary>
      <div class="toolbar-menu-panel toolbar-menu-grid">
        <div class="toolbar-menu-label full">Structure</div>
        <button id="wrap-row-btn">Wrap Row</button><button id="wrap-col-btn">Wrap Column</button>
        <button id="move-up-btn">Move Up</button><button id="move-down-btn">Move Down</button>
        <div class="toolbar-menu-label full">Align</div>
        <button id="align-left-btn">Left</button><button id="align-hcenter-btn">H Center</button><button id="align-right-btn">Right</button>
        <button id="align-top-btn">Top</button><button id="align-vcenter-btn">V Center</button><button id="align-bottom-btn">Bottom</button>
        <div class="toolbar-menu-label full">Distribute</div>
        <button id="dist-h-btn">Horizontal</button><button id="dist-v-btn">Vertical</button>
      </div>
    </details>

    <div class="spacer"></div>
    <div class="breakpoint-cluster"><select id="breakpoint-select" title="Responsive breakpoint"></select><button id="breakpoints-btn" aria-label="Manage breakpoints">…</button></div>
    <div class="tool-group mode-switch" aria-label="Editor mode"><button id="design-mode-btn" class="active">Design</button><button id="split-mode-btn">Split</button><button id="code-mode-btn">Code</button><button id="preview-mode-btn">Preview</button><button id="simulation-mode-btn" title="Run page/project interaction simulation">Simulate</button><button id="component-lab-mode-btn">Lab</button></div>
    <div class="tool-group zoom-tools toolbar-icon-group"><button id="zoom-out-btn" aria-label="Zoom out">−</button><button id="fit-btn">Fit</button><button id="zoom-in-btn" aria-label="Zoom in">+</button></div>

    <button id="import-project-btn" class="toolbar-emphasis" title="Browse a project folder, detect a supported adapter, and import it">Import</button>
    <details class="toolbar-menu toolbar-tools-menu" data-toolbar-menu="tools">
      <summary title="Workspace and layout tools">Tools <span aria-hidden="true">⌄</span></summary>
      <div class="toolbar-menu-panel toolbar-tools-panel">
        <button id="workspace-btn" title="Open a live source workspace by path">Workspace</button>
        <button id="live-preview-btn">Live Preview</button>
        <button id="dock-layout-btn" title="Relocatable dock layout">Dock Layout</button>
      </div>
    </details>
    <button id="roundtrip-btn">Round-trip</button><button id="command-btn" class="command-launcher" aria-label="Command palette">⌘</button><button class="primary" id="export-btn">Export</button>
    <input class="file-hidden" id="file-open" type="file" accept=".json,.astro-ui.json" />
  </div>
  <div class="workspace">
    <aside class="left-dock"><div class="dock-tabs" id="left-tabs"><button class="active" data-left-tab="palette">Palette</button><button data-left-tab="project">Project</button><button data-left-tab="components">Components</button><button data-left-tab="assets">Assets</button><button data-left-tab="sources">Sources</button></div><div id="left-content" class="dock-content"></div></aside>
    <div class="dock-splitter vertical" id="left-splitter"></div>
    <main class="canvas-area"><div class="canvas-head"><div class="doc-tabs" id="doc-tabs"></div><div id="selection-toolbar" class="selection-toolbar"></div><div class="canvas-head-right"><span id="viewport-label"></span><span id="zoom-label">100%</span></div></div>
      <div class="editor-stage" id="editor-stage"><div class="artboard-shell" id="artboard-shell"><div class="artboard" id="artboard"></div></div>
        <section class="source-pane" id="source-pane"><div class="source-pane-toolbar"><select id="source-file-select"></select><span id="source-ownership-badge">HYBRID</span><button id="source-reload-btn">Reload</button><button id="source-sync-btn">Sync Selection</button><button id="source-apply-btn">Save Source</button></div><textarea id="source-editor" spellcheck="false"></textarea></section>
        <section class="live-preview-pane" id="live-preview-pane"><div class="source-pane-toolbar"><span>Real preview</span><button id="live-open-external">Open browser</button></div><iframe id="live-preview-frame"></iframe></section>
        <section class="component-lab-pane" id="component-lab-pane"><div class="component-lab-toolbar"><strong>Component Lab</strong><select id="lab-component-select"></select><button id="lab-new-story">+ Story</button><button id="lab-run-tests" class="primary">Run tests</button></div><div class="component-lab-grid"><aside class="lab-story-browser"><div id="lab-story-list"></div></aside><main class="lab-preview-column"><div class="lab-preview-scroll"><div class="lab-preview-frame"><div id="lab-preview-root"></div></div></div></main><aside class="lab-addon-panel"><div id="lab-addon-content"></div></aside></div></section>
        <section class="simulation-pane" id="simulation-pane">
          <div class="simulation-toolbar">
            <strong>Page / Project Simulation</strong>
            <label>Scope <select id="simulation-scope"><option value="page">Page</option><option value="project" selected>Project</option></select></label>
            <label>Flow <select id="simulation-flow"></select></label>
            <label>Start <select id="simulation-page"></select></label>
            <label>Viewport <select id="simulation-viewport-select"></select></label>
            <button id="simulation-back">← Back</button><button id="simulation-reset">Reset</button><button id="simulation-restart" class="primary">Restart</button>
            <span id="simulation-route" class="simulation-route"></span>
          </div>
          <div class="simulation-grid">
            <main class="simulation-stage"><div class="simulation-viewport" id="simulation-viewport"><div id="simulation-root"></div><div id="simulation-overlay-root"></div></div></main>
            <aside class="simulation-side"><div id="simulation-state"></div><div id="simulation-hotspots"></div><div id="simulation-log"></div></aside>
          </div>
        </section>
      </div>
    </main>
    <div class="dock-splitter vertical" id="right-splitter"></div>
    <aside class="right-dock"><div class="dock-tabs" id="right-tabs"><button class="active" data-right-tab="properties">Properties</button><button data-right-tab="layout">Layout</button><button data-right-tab="actions">Actions</button><button data-right-tab="bindings">Bindings</button><button data-right-tab="code">Code</button><button data-right-tab="variants">States</button><button data-right-tab="data">Data</button><button data-right-tab="effects">Effects</button><button data-right-tab="composition">Composition</button><button data-right-tab="story">Story</button></div><div id="right-content" class="dock-content inspector-content"></div></aside>
  </div>
  <div class="dock-splitter horizontal" id="bottom-splitter"></div>
  <section class="bottom-dock"><div class="bottom-tabs" id="bottom-tabs"><button class="active" data-bottom-tab="problems">Problems <span id="problem-count"></span></button><button data-bottom-tab="objects">Object Tree</button><button data-bottom-tab="manual">Layout Tools</button><button data-bottom-tab="css">CSS Tools</button><button data-bottom-tab="state">State</button><button data-bottom-tab="animation">Animation</button><button data-bottom-tab="tokens">Design Tokens</button><button data-bottom-tab="libraries">Libraries</button><button data-bottom-tab="actions">Connections</button><button data-bottom-tab="content">Content</button><button data-bottom-tab="locales">Locales</button><button data-bottom-tab="tests">Tests</button><button data-bottom-tab="storybook">Story Results</button><button data-bottom-tab="queries">Queries</button><button data-bottom-tab="templates">Templates</button><button data-bottom-tab="usages">Usages</button><button data-bottom-tab="audit">Audit</button><button data-bottom-tab="git">Git</button><button data-bottom-tab="simulation">Simulation</button><button data-bottom-tab="prototype">Prototype</button><button data-bottom-tab="comments">Comments</button><button data-bottom-tab="inspect">Inspect</button><button data-bottom-tab="interchange">Interchange</button><button data-bottom-tab="integrations">Integrations</button><button data-bottom-tab="roundtrip">Round-trip</button><button data-bottom-tab="hotkeys">Hotkeys</button><button data-bottom-tab="console">Console</button></div><button id="bottom-toggle-btn" class="bottom-toggle">⌃</button><div id="bottom-content" class="bottom-content"></div></section>
  <div class="statusbar"><span id="status-selection"></span><span id="status-middle"></span><span id="status-doc"></span></div>
</div>
<div id="popover-layer"></div><div id="modal-layer"></div>
<script type="module" src="./js/app.js"></script>
</body></html>
