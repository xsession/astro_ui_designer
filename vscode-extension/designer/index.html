<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Astro UI Designer Pro</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="app bottom-minimized" id="app">
  <div class="menubar">
    <button data-menu="file">File</button><button data-menu="edit">Edit</button><button data-menu="form">Form</button><button data-menu="layout">Layout</button><button data-menu="view">View</button><button data-menu="project">Project</button><button data-menu="build">Build</button><button data-menu="help">Help</button>
    <span class="menu-spacer"></span><span class="product-title">Astro UI Designer Pro</span>
  </div>
  <div class="toolbar">
    <div class="tool-group file-tools" role="group" aria-label="Project files"><button id="new-btn" title="New project (Ctrl+N)">New</button><button id="open-btn" title="Open designer project (Ctrl+O)">Open</button><button id="save-btn" title="Save designer project (Ctrl+S)">Save</button></div>
    <div class="tool-group history-tools" role="group" aria-label="History"><button id="undo-btn" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button><button id="redo-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button></div>
    <div class="tool-group edit-tools" role="group" aria-label="Edit selection"><button id="cut-btn" title="Cut (Ctrl+X)">Cut</button><button id="copy-btn" title="Copy (Ctrl+C)">Copy</button><button id="paste-btn" title="Paste (Ctrl+V)">Paste</button><button id="duplicate-btn" title="Duplicate (Ctrl+D)">Duplicate</button><button id="delete-btn" title="Delete selected object">Delete</button></div>
    <div class="tool-group layout-tools" role="group" aria-label="Arrange selection"><button id="wrap-row-btn" title="Wrap selection in a Row">Wrap Row</button><button id="wrap-col-btn" title="Wrap selection in a Column">Wrap Column</button><button id="move-up-btn" title="Move earlier in parent">↑</button><button id="move-down-btn" title="Move later in parent">↓</button></div>
    <div class="tool-group align-tools" role="group" aria-label="Align freeform selection"><button id="align-left-btn" title="Align left" aria-label="Align left">L</button><button id="align-hcenter-btn" title="Align horizontal centers" aria-label="Align horizontal centers">HC</button><button id="align-right-btn" title="Align right" aria-label="Align right">R</button><button id="align-top-btn" title="Align top" aria-label="Align top">T</button><button id="align-vcenter-btn" title="Align vertical centers" aria-label="Align vertical centers">VC</button><button id="align-bottom-btn" title="Align bottom" aria-label="Align bottom">B</button><button id="dist-h-btn" title="Distribute horizontally" aria-label="Distribute horizontally">DH</button><button id="dist-v-btn" title="Distribute vertically" aria-label="Distribute vertically">DV</button></div>
    <div class="spacer"></div>
    <div class="tool-group panel-tools" role="group" aria-label="Workspace panels"><button id="toggle-left-btn" class="panel-toggle" title="Toggle component/library panel (Ctrl+Shift+1)" aria-label="Toggle left panel">◧</button><button id="focus-mode-btn" class="panel-toggle" title="Focus canvas (F11)" aria-label="Focus canvas">⛶</button><button id="toggle-right-btn" class="panel-toggle" title="Toggle inspector panel (Ctrl+Shift+2)" aria-label="Toggle right panel">◨</button></div>
    <select id="breakpoint-select" title="Responsive breakpoint"></select>
    <button id="breakpoints-btn" title="Manage breakpoints">…</button>
    <div class="tool-group"><button id="design-mode-btn" class="active">Design</button><button id="split-mode-btn">Split</button><button id="code-mode-btn">Code</button><button id="preview-mode-btn">Preview</button><button id="component-lab-mode-btn" title="Component Lab">Lab</button></div><div class="tool-group"><button id="zoom-out-btn" title="Zoom out">−</button><button id="fit-btn" title="Fit artboard">Fit</button><button id="zoom-in-btn" title="Zoom in">+</button></div>
    <button id="workspace-btn" title="Open existing Astro workspace">Workspace</button><button id="live-preview-btn" title="Start/stop real Astro dev preview">Live</button><button id="command-btn" title="Command palette (Ctrl+Shift+P)">⌘</button>
    <button class="primary" id="export-btn">Export Astro ZIP</button>
    <input class="file-hidden" id="file-open" type="file" accept=".json,.astro-ui.json" />
    <input class="file-hidden" id="asset-open" type="file" multiple /><input class="file-hidden" id="platform-import-open" type="file" accept=".penpot,.json,.svg,.html,.htm,.figma.json,.aui.json" /><input class="file-hidden" id="library-import-open" type="file" accept=".aui-library.json,.json" />
  </div>

  <div class="workspace">
    <aside class="left-dock" aria-label="Components and project">
      <div class="dock-tabs" id="left-tabs"><button class="active" data-left-tab="palette">Palette</button><button data-left-tab="project">Project</button><button data-left-tab="components">Components</button><button data-left-tab="assets">Assets</button><button data-left-tab="sources">Sources</button></div><button id="left-tabs-more" class="dock-tabs-more" title="Choose left panel" aria-label="Choose left panel">⋯</button>
      <div id="left-content" class="dock-content"></div>
    </aside>
    <div class="dock-splitter vertical" id="left-splitter" title="Resize left dock"></div>

    <main class="canvas-area">
      <div class="canvas-head">
        <div class="doc-tabs" id="doc-tabs"></div>
        <div class="canvas-head-right"><span id="viewport-label"></span><span id="zoom-label">100%</span></div>
      </div>
      <div class="editor-stage" id="editor-stage"><div class="artboard-shell" id="artboard-shell"><div class="artboard" id="artboard"></div></div><section class="source-pane" id="source-pane"><div class="source-pane-toolbar"><select id="source-file-select"></select><span id="source-ownership-badge">HYBRID</span><button id="source-reload-btn">Reload</button><button id="source-sync-btn" title="Patch the mapped data-ui-id element from the selected designer node">Sync Selection</button><button id="source-apply-btn">Save Source</button></div><textarea id="source-editor" spellcheck="false"></textarea></section><section class="live-preview-pane" id="live-preview-pane"><div class="source-pane-toolbar"><span>Real Astro/Vite preview</span><button id="live-open-external">Open browser</button></div><iframe id="live-preview-frame" title="Astro live preview"></iframe></section>
      <section class="component-lab-pane" id="component-lab-pane" aria-label="Component Lab">
        <div class="component-lab-toolbar"><strong>Component Lab</strong><select id="lab-component-select" aria-label="Component"></select><button id="lab-new-story">+ Story</button><button id="lab-duplicate-story">Duplicate</button><button id="lab-test-options" title="Choose component-test types">Tests ▾</button><button id="lab-run-tests" class="primary">Run tests</button><span id="lab-test-summary" class="lab-test-summary" aria-live="polite"></span><label class="compact-check"><input id="lab-watch" type="checkbox"> Watch</label></div>
        <div class="component-lab-grid">
          <aside class="lab-story-browser"><div class="lab-search-row"><input id="lab-story-search" placeholder="Search stories…"><button id="lab-filter-btn" title="Filter tags">Filter</button></div><div id="lab-story-list" class="lab-story-list"></div></aside>
          <main class="lab-preview-column"><div class="lab-globals" id="lab-globals"></div><div class="lab-preview-scroll"><div class="lab-preview-frame" id="lab-preview-frame"><div id="lab-preview-root"></div></div></div></main>
          <aside class="lab-addon-panel"><div class="lab-addon-tabs" id="lab-addon-tabs"><button data-lab-addon="controls" class="active">Controls</button><button data-lab-addon="interactions">Interactions</button><button data-lab-addon="a11y">A11y</button><button data-lab-addon="visual">Visual</button><button data-lab-addon="docs">Docs</button></div><div id="lab-addon-content" class="lab-addon-content"></div></aside>
        </div>
      </section></div>
    </main>
    <div class="dock-splitter vertical" id="right-splitter" title="Resize right dock"></div>

    <aside class="right-dock" aria-label="Inspector">
      <div class="dock-tabs" id="right-tabs"><button class="active" data-right-tab="properties">Properties</button><button data-right-tab="layout">Layout</button><button data-right-tab="actions">Actions</button><button data-right-tab="bindings">Bindings</button><button data-right-tab="code">Code</button><button data-right-tab="variants">States</button><button data-right-tab="data">Data</button><button data-right-tab="effects">Effects</button><button data-right-tab="composition">Composition</button><button data-right-tab="story">Story</button></div><button id="right-tabs-more" class="dock-tabs-more" title="Choose inspector" aria-label="Choose inspector">⋯</button>
      <div id="right-content" class="dock-content inspector-content"></div>
    </aside>
  </div>
  <div class="dock-splitter horizontal" id="bottom-splitter" title="Resize bottom dock"></div>

  <section class="bottom-dock" aria-label="Workbench panel">
    <div class="bottom-tabs" id="bottom-tabs"><button class="active" data-bottom-tab="problems">Problems <span id="problem-count"></span></button><button data-bottom-tab="objects">Object Tree</button><button data-bottom-tab="state">State</button><button data-bottom-tab="animation">Animation</button><button data-bottom-tab="tokens">Design Tokens</button><button data-bottom-tab="libraries">Libraries</button><button data-bottom-tab="actions">Connections</button><button data-bottom-tab="content">Content</button><button data-bottom-tab="locales">Locales</button><button data-bottom-tab="tests">Tests</button><button data-bottom-tab="storybook">Story Results</button><button data-bottom-tab="queries">Queries</button><button data-bottom-tab="templates">Templates</button><button data-bottom-tab="usages">Usages</button><button data-bottom-tab="audit">Audit</button><button data-bottom-tab="git">Git</button><button data-bottom-tab="prototype">Prototype</button><button data-bottom-tab="comments">Comments</button><button data-bottom-tab="inspect">Inspect</button><button data-bottom-tab="interchange">Interchange</button><button data-bottom-tab="integrations">Integrations</button><button data-bottom-tab="console">Console</button></div><button id="bottom-tabs-more" class="dock-tabs-more bottom-more" title="Choose workbench panel" aria-label="Choose workbench panel">⋯</button><button id="bottom-toggle-btn" class="bottom-toggle" title="Expand bottom panel" aria-label="Expand bottom panel">⌃</button>
    <div id="bottom-content" class="bottom-content"></div>
  </section>

  <div class="statusbar"><span id="status-selection"></span><span id="status-middle"></span><span id="status-doc"></span></div>
</div>
<div id="popover-layer"></div>
<div id="modal-layer"></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
